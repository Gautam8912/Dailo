<div id="fx-header"></div>

<main id="fx-main" class="fx-main" tabindex="-1">
  <div class="fx-container">
    <!-- Promotional carousel -->
    <section class="fx-section-tight" aria-label="Current offers" id="home-banners">
      <div class="fx-skeleton fx-skel-banner" aria-hidden="true"></div>
    </section>

    <!-- Quick categories -->
    <section class="fx-section-tight" aria-labelledby="home-categories-title" id="home-categories">
      <div class="fx-rail-head">
        <div>
          <h2 id="home-categories-title">Shop by category</h2>
          <p class="fx-rail-sub">Groceries, fresh produce, essentials, electronics and more.</p>
        </div>
        <a class="fx-rail-link" href="category.html">All categories</a>
      </div>
      <div class="fx-cat-grid" id="home-category-grid"></div>
    </section>

    <!-- Dynamic home sections are injected here by js/pages/home.js -->
    <div id="home-sections" class="fx-stack"></div>
  </div>
</main>

<div id="fx-footer"></div>
<div id="fx-bottomnav"></div>
