      <div class="fx-pdp">
        <div class="fx-skeleton fx-skel-banner" style="height:420px"></div>

          <div class="fx-skeleton fx-skel-line fx-skel-line-sm"></div>

      </div>

</main>

<div id="fx-footer"></div>
<div id="fx-bottomnav"></div>
